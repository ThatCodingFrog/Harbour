name: build-harbour-ports

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-matrix:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact-name: harbour-ports-linux
            executable-path: build/HarbourPorts
          - os: macos-14
            artifact-name: harbour-ports-macos
            executable-path: build/HarbourPorts
          - os: windows-latest
            artifact-name: harbour-ports-windows
            executable-path: build/Release/HarbourPorts.exe

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Setup Ninja build generator (your existing install steps)
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja cmake

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install -y ninja cmake
          refreshenv

      # Restore vcpkg Cache
      - name: Restore vcpkg Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg
            ~/AppData/Local/vcpkg/archives
            ${{ github.workspace }}/build/vcpkg_installed
            ${{ env.VCPKG_ROOT }}
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}-
            ${{ runner.os }}-vcpkg-

      # Bootstrap vcpkg (Linux / macOS)
      - name: Bootstrap vcpkg (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ ! -d "${VCPKG_ROOT}" ]; then
            git clone --depth=1 https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          fi
          pushd "${VCPKG_ROOT}"
          ./bootstrap-vcpkg.sh -disableMetrics
          popd

      # Bootstrap vcpkg (Windows)
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Test-Path -Path $env:VCPKG_ROOT)) {
            git clone --depth=1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          }
          Push-Location $env:VCPKG_ROOT
          .\bootstrap-vcpkg.bat
          Pop-Location

      # Fast compiler caching (sccache / ccache)
      - name: Configure Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          key: ${{ runner.os }}-harbour-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-harbour-ccache-${{ github.ref }}
            ${{ runner.os }}-harbour-ccache
          save: ${{ github.ref_name == github.event.repository.default_branch }}

      # Configure CMake (Linux)
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Configure CMake (macOS)
      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-osx \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Configure CMake (Windows)
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cmake -B build `
            -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      # Build Project
      - name: Build Harbour Ports
        run: cmake --build build --config Release

      # Upload Artifacts
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.executable-path }}
          if-no-files-found: error