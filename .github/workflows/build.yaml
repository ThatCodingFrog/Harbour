name: build-harbour-ports

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-matrix:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact-name: harbour-ports-linux
            executable-path: build/HarbourPorts
          - os: macos-14
            artifact-name: harbour-ports-macos
            executable-path: build/HarbourPorts
          - os: windows-latest
            artifact-name: harbour-ports-windows
            executable-path: build/Release/HarbourPorts.exe

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Setup Ninja build generator
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja cmake

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install -y ninja cmake
          refreshenv

      # Configure MSVC for Windows build
      - name: Configure Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      # Restore/Save vcpkg Cache
      - name: Restore vcpkg Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg
            ~/AppData/Local/vcpkg/archives
            ${{ github.workspace }}/build/vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}-
            ${{ runner.os }}-vcpkg-

      # Fast compiler caching (sccache / ccache)
      - name: Configure Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          key: ${{ runner.os }}-harbour-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-harbour-ccache-${{ github.ref }}
            ${{ runner.os }}-harbour-ccache
          save: ${{ github.ref_name == github.event.repository.default_branch }}

      # Configure CMake
      - name: Configure CMake
        run: |
          cmake -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}

      # Build Project
      - name: Build Harbour Ports
        run: cmake --build build --config Release

      # Upload Artifacts
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.executable-path }}
          if-no-files-found: error